<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>X-Request-Id 全链路流转图</title>
  <desc>前端到NestJS到ai-service到Java网关的请求ID生成、透传与消费链路</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="28" font-size="14" font-weight="500" fill="#444441" font-family="sans-serif">X-Request-Id 全链路流转</text>

  <g font-family="sans-serif">
    <rect x="40" y="46" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="100" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">前端</text>

    <rect x="190" y="46" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="260" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">NestJS 网关</text>

    <rect x="360" y="46" width="140" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="430" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">ai-service</text>

    <rect x="530" y="46" width="110" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="585" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Java 网关</text>

    <path d="M162 68 L186 68" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M332 68 L356 68" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M502 68 L526 68" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g font-size="12" fill="#5F5E5A">
      <text x="100" y="118" text-anchor="middle">可选:自发携带</text>
      <text x="100" y="136" text-anchor="middle">或从响应头取回</text>
      <text x="100" y="154" text-anchor="middle">用于报障关联</text>

      <text x="260" y="118" text-anchor="middle" fill="#444441">request-id.middleware</text>
      <text x="260" y="136" text-anchor="middle">沿用上游,缺则 UUID</text>
      <text x="260" y="154" text-anchor="middle">截断 64 字符</text>
      <text x="260" y="172" text-anchor="middle" fill="#444441">挂 req.requestId</text>
      <text x="260" y="190" text-anchor="middle">响应头回写</text>
      <text x="260" y="208" text-anchor="middle">chat.service 转发时带头</text>

      <text x="430" y="118" text-anchor="middle" fill="#444441">chat 入口 Header 读取</text>
      <text x="430" y="136" text-anchor="middle">注入 provider 字典</text>
      <text x="430" y="154" text-anchor="middle" fill="#444441">build_chat / embed_texts</text>
      <text x="430" y="172" text-anchor="middle">组装 X-Request-Id 头</text>
      <text x="430" y="190" text-anchor="middle">随模型调用发出</text>

      <text x="585" y="118" text-anchor="middle" fill="#444441">RequestIdFilter</text>
      <text x="585" y="136" text-anchor="middle">提取入站头 → MDC</text>
      <text x="585" y="154" text-anchor="middle" fill="#444441">日志行 [requestId]</text>
      <text x="585" y="172" text-anchor="middle">invoke_logs 落库</text>
      <text x="585" y="190" text-anchor="middle">响应头回写</text>
      <text x="585" y="208" text-anchor="middle">finally 清理 MDC</text>
    </g>
  </g>

  <rect x="40" y="248" width="600" height="66" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="60" y="272" font-size="12" fill="#444441" font-family="sans-serif">回程:响应头同样携带该 ID</text>
  <text x="60" y="294" font-size="12" fill="#5F5E5A" font-family="sans-serif">前端 / 调用方从响应头即可取回本次请求的 ID,无需解析日志</text>
  <path d="M585 238 L585 262 L404 262" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M260 238 L260 262 L204 262" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="40" y="332" width="600" height="62" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="60" y="356" font-size="12" fill="#444441" font-family="sans-serif">边界约定</text>
  <text x="60" y="376" font-size="12" fill="#5F5E5A" font-family="sans-serif">Java 网关调用上游 LLM 时不携带(仅内部链路使用);MDC 用完即清,防线程池复用串号</text>
</svg>
