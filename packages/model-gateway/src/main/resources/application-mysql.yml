# 与 NestJS 网关共用 MySQL(ai_agent 库,users 等表直接读写真实数据):
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# 建议用根目录 run-mysql.ps1 启动(自动从 NestJS .env 读取 DB_PASSWORD / JWT_SECRET)
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:ai_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

# 共用真实库时不写演示数据(不建 admin/演示渠道/假日志),只保留应用自身需要的表
gateway:
  seed:
    enabled: false
